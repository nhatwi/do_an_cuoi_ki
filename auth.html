<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập & Đăng ký - TechStore</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

  <!-- HEADER / NAVBAR DÙNG CHUNG -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-warning" href="index.html">
        <i class="bi bi-shop"></i> TECHSTORE
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      
      <div class="collapse navbar-collapse" id="mainMenu">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">Trang chủ</a></li>
          <li class="nav-item"><a class="nav-link" href="products.html">Sản phẩm</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">Giới thiệu</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Liên hệ</a></li>
          <li class="nav-item"><a class="nav-link" href="feedback.html">Góp ý</a></li>
        </ul>

        <div class="d-flex align-items-center gap-2">
          <a href="auth.html" class="btn btn-light btn-sm fw-semibold" id="navAuthBtn">Đăng nhập / Đăng ký</a>
          <a href="account.html" class="btn btn-outline-warning btn-sm" title="Tài khoản & Đổi mật khẩu">
            <i class="bi bi-person-circle"></i>
          </a>
          <button class="btn btn-warning btn-sm position-relative" data-bs-toggle="modal" data-bs-target="#cartModal">
            <i class="bi bi-cart3"></i> Giỏ hàng
            <span id="cartCount" class="badge bg-danger rounded-pill">0</span>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- KHUNG FORM ĐĂNG NHẬP / ĐĂNG KÝ -->
  <main class="container py-5 flex-grow-1 d-flex align-items-center">
    <div class="row justify-content-center w-100">
      <div class="col-12 col-md-7 col-lg-5">
        <div class="card shadow border-0 rounded-3 overflow-hidden fade-in">
          
          <!-- Thanh chuyển Tab Đăng nhập / Đăng ký -->
          <div class="card-header bg-white p-0 border-bottom">
            <ul class="nav nav-tabs nav-fill" id="authTabs" role="tablist">
              <li class="nav-item" role="presentation">
                <button class="nav-link active fw-bold py-3" id="login-tab" data-bs-toggle="tab" data-bs-target="#loginPane" type="button">
                  <i class="bi bi-box-arrow-in-right"></i> Đăng nhập
                </button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link fw-bold py-3" id="register-tab" data-bs-toggle="tab" data-bs-target="#registerPane" type="button">
                  <i class="bi bi-person-plus"></i> Đăng ký
                </button>
              </li>
            </ul>
          </div>

          <div class="card-body p-4">
            <!-- Vùng hiển thị thông báo lỗi / thành công -->
            <div id="authAlert" class="alert d-none" role="alert"></div>

            <div class="tab-content">
              <!-- TAB 1: ĐĂNG NHẬP -->
              <div class="tab-pane fade show active" id="loginPane" role="tabpanel">
                <form id="loginForm">
                  <div class="mb-3">
                    <label class="form-label fw-semibold">Email đăng nhập</label>
                    <input type="email" id="loginEmail" class="form-control" placeholder="name@example.com" required>
                  </div>
                  <div class="mb-3">
                    <label class="form-label fw-semibold">Mật khẩu</label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="Nhập mật khẩu" required>
                  </div>
                  <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Đăng nhập ngay</button>
                </form>
              </div>

              <!-- TAB 2: ĐĂNG KÝ -->
              <div class="tab-pane fade" id="registerPane" role="tabpanel">
                <form id="registerForm">
                  <div class="mb-3">
                    <label class="form-label fw-semibold">Họ và tên</label>
                    <input type="text" id="regName" class="form-control" placeholder="VD: Nguyễn Văn A" required>
                  </div>
                  <div class="mb-3">
                    <label class="form-label fw-semibold">Email</label>
                    <input type="email" id="regEmail" class="form-control" placeholder="name@example.com" required>
                  </div>
                  <div class="mb-3">
                    <label class="form-label fw-semibold">Mật khẩu</label>
                    <input type="password" id="regPassword" class="form-control" placeholder="Tối thiểu 4 ký tự" minlength="4" required>
                  </div>
                  <div class="mb-3">
                    <label class="form-label fw-semibold">Nhập lại mật khẩu</label>
                    <input type="password" id="regConfirmPassword" class="form-control" placeholder="Xác nhận mật khẩu" required>
                  </div>
                  <button type="submit" class="btn btn-success w-100 fw-bold py-2">Tạo tài khoản</button>
                </form>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </main>

  <!-- MODAL GIỎ HÀNG DÙNG CHUNG -->
  <div class="modal fade" id="cartModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header bg-dark text-white">
          <h5 class="modal-title"><i class="bi bi-cart3"></i> Giỏ hàng của bạn</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="cartBody"></div>
        <div class="modal-footer justify-content-between">
          <h5 class="mb-0">Tổng cộng: <span id="cartTotal" class="text-danger fw-bold">0đ</span></h5>
          <button type="button" class="btn btn-primary" onclick="checkoutCart()">Thanh toán</button>
        </div>
      </div>
    </div>
  </div>

  <!-- FOOTER DÙNG CHUNG -->
  <footer class="bg-dark text-white py-4 mt-auto">
    <div class="container text-center">
      <p class="mb-1 fw-bold">TECHSTORE - Đồ án Thương mại điện tử</p>
      <small class="text-secondary">&copy; 2026 All rights reserved.</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
