<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Góp ý khách hàng - TechStore</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

  <!-- HEADER / NAVBAR DÙNG CHUNG -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-warning" href="index.html">
        <i class="bi bi-shop"></i> TECHSTORE
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      
      <div class="collapse navbar-collapse" id="mainMenu">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">Trang chủ</a></li>
          <li class="nav-item"><a class="nav-link" href="products.html">Sản phẩm</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">Giới thiệu</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Liên hệ</a></li>
          <li class="nav-item"><a class="nav-link active" href="feedback.html">Góp ý</a></li>
        </ul>

        <div class="d-flex align-items-center gap-2">
          <a href="auth.html" class="btn btn-outline-light btn-sm" id="navAuthBtn">Đăng nhập / Đăng ký</a>
          <a href="account.html" class="btn btn-outline-warning btn-sm" title="Tài khoản & Đổi mật khẩu">
            <i class="bi bi-person-circle"></i>
          </a>
          <button class="btn btn-warning btn-sm position-relative" data-bs-toggle="modal" data-bs-target="#cartModal">
            <i class="bi bi-cart3"></i> Giỏ hàng
            <span id="cartCount" class="badge bg-danger rounded-pill">0</span>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- NỘI DUNG TRANG GÓP Ý -->
  <main class="container py-5 flex-grow-1 fade-in">
    <div class="row justify-content-center g-4">
      <!-- Form gửi góp ý -->
      <div class="col-lg-6">
        <div class="card border-0 shadow-sm">
          <div class="card-header bg-primary text-white py-3">
            <h5 class="mb-0 fw-bold"><i class="bi bi-chat-heart"></i> Góp ý cải thiện dịch vụ</h5>
          </div>
          <div class="card-body p-4">
            <div id="fbAlert" class="alert alert-success d-none">
              Cảm ơn đóng góp của bạn! Ý kiến đã được ghi nhận.
            </div>
            <form id="feedbackForm">
              <div class="mb-3">
                <label class="form-label fw-semibold">Tên của bạn *</label>
                <input type="text" id="fbName" class="form-control" placeholder="VD: Trần Minh Tuấn" required>
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold">Mức độ hài lòng</label>
                <select id="fbRating" class="form-select">
                  <option value="5">⭐⭐⭐⭐⭐ - Rất hài lòng</option>
                  <option value="4">⭐⭐⭐⭐ - Hài lòng</option>
                  <option value="3">⭐⭐⭐ - Bình thường</option>
                  <option value="2">⭐⭐ - Cần cải thiện</option>
                  <option value="1">⭐ - Chưa hài lòng</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold">Nội dung góp ý *</label>
                <textarea id="fbContent" class="form-control" rows="4" placeholder="Chia sẻ cảm nhận của bạn về giao diện, sản phẩm hoặc dịch vụ..." required></textarea>
              </div>
              <button type="submit" class="btn btn-primary w-100 fw-bold">Gửi góp ý ngay</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Danh sách góp ý gần đây lưu trong localStorage -->
      <div class="col-lg-6">
        <h5 class="fw-bold mb-3"><i class="bi bi-chat-left-quote text-primary"></i> Phản hồi từ khách hàng</h5>
        <div id="feedbackList" class="d-flex flex-column gap-3"></div>
      </div>
    </div>
  </main>

  <!-- MODAL GIỎ HÀNG DÙNG CHUNG -->
  <div class="modal fade" id="cartModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header bg-dark text-white">
          <h5 class="modal-title"><i class="bi bi-cart3"></i> Giỏ hàng của bạn</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="cartBody"></div>
        <div class="modal-footer justify-content-between">
          <h5 class="mb-0">Tổng cộng: <span id="cartTotal" class="text-danger fw-bold">0đ</span></h5>
          <button type="button" class="btn btn-primary" onclick="checkoutCart()">Thanh toán</button>
        </div>
      </div>
    </div>
  </div>

  <!-- FOOTER DÙNG CHUNG -->
  <footer class="bg-dark text-white py-4 mt-auto">
    <div class="container text-center">
      <p class="mb-1 fw-bold">TECHSTORE - Đồ án Thương mại điện tử</p>
      <small class="text-secondary">&copy; 2026 All rights reserved.</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    const defaultFeedbacks = [
      { name: "Lê Hoàng Nam", rating: 5, content: "Giao diện web mượt, tìm kiếm sản phẩm nhanh và dễ dùng trên điện thoại.", date: "25/11/2026" },
      { name: "Nguyễn Thu Hà", rating: 4, content: "Giá cả phù hợp với sinh viên, mong shop nhập thêm nhiều mẫu bàn phím cơ.", date: "26/11/2026" }
    ];

    function renderFeedbacks() {
      let list = JSON.parse(localStorage.getItem("techstore_feedbacks"));
      if (!list) {
        list = defaultFeedbacks;
        localStorage.setItem("techstore_feedbacks", JSON.stringify(list));
      }
      document.getElementById("feedbackList").innerHTML = list.map(fb => `
        <div class="card border-0 shadow-sm">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <h6 class="fw-bold mb-0">${fb.name}</h6>
              <small class="text-muted">${fb.date}</small>
            </div>
            <div class="mb-2 small">${"⭐".repeat(fb.rating)}</div>
            <p class="text-secondary mb-0 small">${fb.content}</p>
          </div>
        </div>
      `).join("");
    }

    document.getElementById("feedbackForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const list = JSON.parse(localStorage.getItem("techstore_feedbacks")) || defaultFeedbacks;
      list.unshift({
        name: document.getElementById("fbName").value.trim(),
        rating: Number(document.getElementById("fbRating").value),
        content: document.getElementById("fbContent").value.trim(),
        date: new Date().toLocaleDateString("vi-VN")
      });
      localStorage.setItem("techstore_feedbacks", JSON.stringify(list));
      this.reset();
      document.getElementById("fbAlert").classList.remove("d-none");
      renderFeedbacks();
    });

    document.addEventListener("DOMContentLoaded", renderFeedbacks);
  </script>
</body>
</html>
